services:
  - type: web
    name: ftp-bridge
    runtime: node
    plan: free
    rootDir: bridge
    buildCommand: npm install
    startCommand: node ftp-bridge.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FTP_HOST
        value: giowm1082.siteground.biz
      - key: FTP_USER
        value: nirmako@tabxle.com
      - key: FTP_PORT
        value: "21"
      - key: FTP_SECURE
        value: "true"
      - key: BRIDGE_API_KEY
        generateValue: true
      - key: FTP_PASS
        sync: false
